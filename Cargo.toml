[package]
name = "zapple-pay"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zapple-pay"
path = "src/main.rs"

[dependencies]
log = "0.4"
pretty_env_logger = "0.5.0"
anyhow = "1.0"
axum = "0.8"
bitcoin = "0.32"
chrono = { version = "0.4.26", features = ["serde"] }
diesel = { version = "2.3", features = ["postgres", "r2d2", "chrono", "numeric"] }
diesel_migrations = "2.3"
itertools = "0.11.0"
lightning-invoice = { version = "0.33", features = ["std"] }
hex = "0.4.3"
http-body-util = "0.1"
clap = { version = "4.1.14", features = ["derive"] }
futures = "0.3.28"
lnurl-rs = { version = "0.10", default-features = false, features = ["async", "async-https"] }
nostr = { version = "0.44", default-features = false, features = ["std", "nip04", "nip47", "nip98"] }
nostr-sdk = { version = "0.44", features = ["nip59"] }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
urlencoding = "2.1.2"
regex = "1.10.2"
lazy_static = "1.4"

[dev-dependencies]
dotenv = "0.15.0"
tower = "0.5"
